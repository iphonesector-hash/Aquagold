services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquagold
      POSTGRES_USER: aquagold
      POSTGRES_PASSWORD: ${AQUAGOLD_DB_PASSWORD:?Set AQUAGOLD_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquagold -d aquagold"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    restart: unless-stopped
    environment:
      AQUAGOLD_ENV: development
      AQUAGOLD_DATABASE_URL: postgresql://aquagold:${AQUAGOLD_DB_PASSWORD}@postgres:5432/aquagold
      AQUAGOLD_SECRET_KEY: ${AQUAGOLD_SECRET_KEY:?Set AQUAGOLD_SECRET_KEY in .env}
      AQUAGOLD_ADMIN_USERNAME: ${AQUAGOLD_ADMIN_USERNAME:-}
      AQUAGOLD_ADMIN_PASSWORD: ${AQUAGOLD_ADMIN_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    command: ["sh", "-c", "python scripts/migrate.py && exec gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 2 --timeout 120 --access-logfile - --error-logfile - app:app"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
