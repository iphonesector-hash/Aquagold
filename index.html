<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AquaGold CRM v3</title><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"><link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="/ui-v3.js"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
body{font-family:Vazirmatn,system-ui,sans-serif;background:#f6f8fa;color:#0f172a}[x-cloak]{display:none!important}.glass{background:rgba(255,255,255,.93);backdrop-filter:blur(14px)}.card{background:white;border:1px solid #e6edf2;border-radius:22px;box-shadow:0 8px 28px rgba(15,23,42,.05)}.field{width:100%;border:1px solid #d8e1e8;border-radius:14px;padding:.78rem .9rem;background:#fff;outline:none}.field:focus{border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.12)}.btn{border-radius:14px;padding:.72rem 1rem;font-weight:800}.primary{background:#0f766e;color:#fff}.soft{background:#ecfdf5;color:#0f766e}.navon{background:#0f766e;color:#fff}.chip{border-radius:999px;padding:.28rem .65rem;font-size:.72rem}.safe{padding-bottom:max(1rem,env(safe-area-inset-bottom))}.maplibregl-popup-content{font-family:Vazirmatn!important;border-radius:14px!important}.mono{font-variant-numeric:tabular-nums}
@media print{.no-print,header,nav{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #ddd}main{max-width:none!important;padding:0!important}}
</style>
</head>
<body x-data="app()" x-init="init()" x-cloak>
<template x-if="!token"><main class="min-h-screen grid place-items-center p-5 bg-gradient-to-br from-teal-900 via-teal-700 to-cyan-700"><section class="glass w-full max-w-md rounded-[30px] p-7 shadow-2xl"><div class="w-16 h-16 rounded-2xl bg-teal-700 text-white grid place-items-center text-3xl">💧</div><h1 class="text-3xl font-black mt-4">AquaGold</h1><p class="text-slate-500">CRM هوشمند خدمات تصفیه آب</p><form @submit.prevent="login" class="space-y-3 mt-7"><input x-model="loginForm.username" class="field" placeholder="نام کاربری"><input x-model="loginForm.password" type="password" class="field" placeholder="رمز عبور"><p x-show="error" x-text="error" class="text-red-600 text-sm"></p><button class="btn primary w-full" x-text="busy?'در حال ورود…':'ورود به پنل'"></button></form></section></main></template>
<template x-if="token"><div class="min-h-screen">
<header class="sticky top-0 z-50 glass border-b border-slate-200 px-4 py-3 no-print"><div class="max-w-7xl mx-auto flex justify-between items-center"><div><b class="text-xl">AquaGold</b><div class="text-xs text-slate-500">مالی • مشتری • سرویس • نقشه • هوش مصنوعی</div></div><div class="flex gap-2 items-center"><span class="hidden sm:block text-sm" x-text="userName"></span><button @click="logout" class="btn bg-red-50 text-red-600 !py-2">خروج</button></div></div></header>
<nav class="sticky top-[65px] z-40 glass border-b border-slate-200 p-2 overflow-x-auto no-print"><div class="max-w-7xl mx-auto flex gap-2 min-w-max"><template x-for="n in navs" :key="n.id"><button @click="go(n.id)" class="btn !py-2 !px-3" :class="page===n.id?'navon':'bg-white border text-slate-600'"><span x-text="n.icon"></span> <span x-text="n.label"></span></button></template></div></nav>
<main class="max-w-7xl mx-auto p-4 md:p-7 safe space-y-5">

<section x-show="page==='dashboard'" class="space-y-5"><div class="grid grid-cols-2 lg:grid-cols-5 gap-3"><div class="card p-4"><small class="text-slate-500">دریافتی امروز</small><b class="block text-xl mono" x-text="money(stats.today?.received)"></b></div><div class="card p-4"><small class="text-slate-500">سهم شرکت امروز</small><b class="block text-xl mono" x-text="money(stats.today?.company_share)"></b></div><div class="card p-4"><small class="text-slate-500">هزینه امروز</small><b class="block text-xl mono" x-text="money(stats.today?.expenses)"></b></div><div class="card p-4"><small class="text-slate-500">سود خالص امروز</small><b class="block text-xl text-emerald-700 mono" x-text="money(stats.today?.net_profit)"></b></div><div class="card p-4 col-span-2 lg:col-span-1"><small class="text-slate-500">مشتری‌ها</small><b class="block text-xl" x-text="stats.total_customers||0"></b></div></div><div class="grid lg:grid-cols-3 gap-4"><div class="card p-5 lg:col-span-2"><div class="flex justify-between"><h2 class="font-black">کارهای اخیر</h2><button @click="go('daily')" class="text-teal-700 text-sm">گزارش روزانه</button></div><template x-for="j in jobs.slice(0,7)" :key="j.id"><div class="border-b py-3 flex justify-between gap-3"><div><b x-text="j.name"></b><div class="text-xs text-slate-500" x-text="j.description||j.service_type||'سرویس'"></div><div class="text-xs text-slate-400" x-text="persianDateTime(j.date)"></div></div><div class="text-left"><b x-text="money(j.received_amount)+' تومان'"></b><div class="text-xs text-slate-400" x-text="'شرکت: '+money(j.company_share_amount)"></div></div></div></template></div><div class="card p-5"><h2 class="font-black mb-3">دسترسی سریع</h2><div class="grid gap-2"><button @click="newCustomer()" class="btn primary">＋ مشتری جدید</button><button @click="go('new-service')" class="btn soft">🧾 سرویس جدید</button><button @click="go('smart')" class="btn bg-violet-50 text-violet-700">✨ ثبت هوشمند</button><button @click="go('expense')" class="btn bg-amber-50 text-amber-700">💸 هزینه/خرید</button><button @click="go('map')" class="btn bg-blue-50 text-blue-700">📍 نقشه زنده</button></div></div></div></section>

<section x-show="page==='daily'" class="space-y-4"><div class="flex flex-col md:flex-row md:justify-between gap-3"><div><h2 class="text-2xl font-black">گزارش روزانه شمسی</h2><p class="text-sm text-slate-500">دریافتی، سهم شرکت، هزینه، مانده مشتری و سود خالص هر روز</p></div><div class="flex gap-2 no-print"><button @click="copyAllDaily" class="btn soft">📋 کپی همه</button><button @click="printPdf" class="btn bg-slate-100">🖨 چاپ / PDF</button></div></div><template x-for="d in dailyGroups" :key="d.iso"><article class="card overflow-hidden mb-4"><div class="p-4 bg-slate-50 flex justify-between"><div><b class="text-lg" x-text="persianDate(d.iso)"></b><div class="text-xs text-slate-500" x-text="d.services+' سرویس'"></div></div><button @click="copyDay(d)" class="btn bg-white border !py-2 no-print">کپی این روز</button></div><div class="divide-y"><template x-for="j in d.jobs" :key="j.id"><div class="p-4 grid md:grid-cols-[1fr_auto] gap-2"><div><b x-text="j.name"></b><div class="text-sm" x-text="j.description||j.service_type||'سرویس'"></div><div class="text-xs text-slate-400" x-text="[j.phone,j.address].filter(Boolean).join(' • ')"></div></div><div class="text-left"><b x-text="money(j.received_amount)+' تومان'"></b><div class="text-xs" x-text="'شرکت: '+money(j.company_share_amount)"></div></div></div></template></div><div class="p-4 grid grid-cols-2 md:grid-cols-5 gap-3 bg-teal-50"><div><small>دریافتی</small><b class="block" x-text="money(d.received)"></b></div><div><small>سهم شرکت</small><b class="block" x-text="money(d.company_share)"></b></div><div><small>هزینه</small><b class="block" x-text="money(d.expenses)"></b></div><div><small>مانده مشتری</small><b class="block" x-text="money(d.customer_balance)"></b></div><div><small>سود خالص</small><b class="block text-emerald-700" x-text="money(d.net_profit)"></b></div></div></article></template></section>

<section x-show="page==='customers'" class="space-y-4"><div class="flex justify-between"><div><h2 class="text-2xl font-black">مشتریان</h2><p class="text-sm text-slate-500">هر مشتری ID مستقل؛ هم‌فامیل‌ها ادغام خودکار نمی‌شوند.</p></div><button @click="newCustomer()" class="btn primary">＋ مشتری</button></div><div class="card p-4"><input x-model="customerSearch" class="field" placeholder="نام، شماره، آدرس، پلاک، واحد، مدل دستگاه یا نام روی نقشه…"></div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-3"><template x-for="c in filteredCustomers" :key="c.id"><div class="card p-4"><div class="flex justify-between"><div><b class="text-lg" x-text="c.name"></b><div class="text-xs text-slate-500" x-text="(c.phones||[]).join(' • ')||'بدون شماره'"></div></div><span x-show="c.latitude" class="chip bg-emerald-50 text-emerald-700 h-fit">GPS ✓</span></div><div class="text-sm text-slate-500 mt-3" x-text="c.address||'بدون آدرس'"></div><div class="text-xs text-slate-400 mt-1" x-text="c.map_label?'نقشه: '+c.map_label:''"></div><div class="grid grid-cols-3 gap-2 mt-4"><button @click="openCustomer(c)" class="btn bg-slate-50 !py-2">تاریخچه</button><button @click="editCustomer(c)" class="btn soft !py-2">ویرایش</button><button @click="serviceFor(c)" class="btn primary !py-2">سرویس</button></div></div></template></div></section>

<section x-show="page==='customer-edit'" class="max-w-5xl mx-auto"><div class="card p-5"><div class="flex justify-between"><div><h2 class="text-2xl font-black" x-text="customerEdit.id?'ویرایش مشتری':'ثبت مشتری جدید'"></h2><p class="text-sm text-slate-500">GPS فعلی، انتخاب نقطه، marker قابل جابه‌جایی و مختصات دستی</p></div><button @click="go('customers')">✕</button></div><div class="grid md:grid-cols-2 gap-3 mt-5"><input x-model="customerEdit.first_name" class="field" placeholder="نام"><input x-model="customerEdit.last_name" class="field" placeholder="نام خانوادگی *"><input x-model="customerEdit.phone" class="field" placeholder="شماره اصلی"><input x-model="customerEdit.phone2" class="field" placeholder="شماره دوم"><input x-model="customerEdit.map_label" class="field" placeholder="نام نمایشی روی نقشه"><input x-model="customerEdit.device_model" class="field" placeholder="مدل دستگاه"><input x-model="customerEdit.plaque" class="field" placeholder="پلاک"><input x-model="customerEdit.unit_no" class="field" placeholder="واحد"><textarea x-model="customerEdit.address" class="field md:col-span-2 min-h-24" placeholder="آدرس کامل"></textarea><textarea x-model="customerEdit.notes" class="field md:col-span-2" placeholder="یادداشت"></textarea></div><div class="mt-5 grid lg:grid-cols-3 gap-3"><div class="lg:col-span-2 rounded-2xl overflow-hidden border"><div id="editMap" style="height:390px"></div></div><div class="space-y-3"><button @click="captureEditGps" class="btn primary w-full">📍 GPS فعلی</button><p class="text-xs text-slate-500">روی نقشه بزن یا marker را با انگشت جابه‌جا کن.</p><input x-model.number="customerEdit.latitude" type="number" step="any" class="field" placeholder="Latitude"><input x-model.number="customerEdit.longitude" type="number" step="any" class="field" placeholder="Longitude"><button @click="applyManualCoords" class="btn soft w-full">اعمال دستی</button></div></div><button @click="saveCustomer" class="btn primary w-full mt-5">ذخیره مشتری</button></div></section>

<section x-show="page==='customer-detail'&&selectedCustomer" class="max-w-4xl mx-auto space-y-4"><div class="card p-5"><div class="flex justify-between"><div><h2 class="text-2xl font-black" x-text="selectedCustomer?.name"></h2><p class="text-sm text-slate-500" x-text="(selectedCustomer?.phones||[]).join(' • ')"></p></div><button @click="go('customers')">✕</button></div><div class="grid md:grid-cols-2 gap-3 mt-4"><div class="bg-slate-50 p-4 rounded-2xl"><small>آدرس</small><b class="block" x-text="selectedCustomer?.address||'—'"></b></div><div class="bg-slate-50 p-4 rounded-2xl"><small>نام روی نقشه</small><b class="block" x-text="selectedCustomer?.map_label||selectedCustomer?.name"></b></div></div><div class="flex gap-2 mt-4 no-print"><button @click="editCustomer(selectedCustomer)" class="btn soft">ویرایش</button><button @click="serviceFor(selectedCustomer)" class="btn primary">سرویس جدید</button><button x-show="selectedCustomer?.latitude" @click="showOnMap(selectedCustomer)" class="btn bg-blue-50 text-blue-700">روی نقشه</button></div></div><div class="card p-5"><h3 class="font-black">تاریخچه سرویس</h3><template x-for="j in selectedCustomerJobs" :key="j.id"><div class="border-b py-3 flex justify-between"><div><b x-text="j.description||j.service_type"></b><div class="text-xs text-slate-400" x-text="persianDateTime(j.date)"></div></div><div class="text-left"><b x-text="money(j.received_amount)"></b><div class="text-xs" x-text="'مانده: '+money(j.customer_balance)"></div></div></div></template></div></section>

<section x-show="page==='services'" class="space-y-4"><div class="flex justify-between"><div><h2 class="text-2xl font-black">سرویس‌ها</h2><p class="text-sm text-slate-500">فاکتور، دریافتی، سهم شرکت، مانده و یادآوری</p></div><button @click="go('new-service')" class="btn primary">＋ سرویس</button></div><div class="card p-4"><input x-model="serviceSearch" class="field" placeholder="جست‌وجوی مشتری، سرویس، تلفن یا آدرس…"></div><template x-for="j in filteredJobs" :key="j.id"><div class="card p-4 grid md:grid-cols-[1fr_auto] gap-3 mb-3"><div><b x-text="j.name"></b><div class="text-sm" x-text="j.description||j.service_type||'سرویس'"></div><div class="text-xs text-slate-400" x-text="[j.phone,persianDateTime(j.date)].filter(Boolean).join(' • ')"></div></div><div class="text-left text-sm"><b x-text="money(j.received_amount)+' تومان'"></b><div x-text="'فاکتور: '+money(j.invoice_amount)"></div><div x-text="'شرکت: '+money(j.company_share_amount)"></div><div x-show="j.customer_balance>0" class="text-red-600" x-text="'مانده: '+money(j.customer_balance)"></div></div></div></template></section>

<section x-show="page==='new-service'" class="max-w-4xl mx-auto"><div class="card p-5"><div class="flex justify-between"><div><h2 class="text-2xl font-black">ثبت سرویس</h2><p class="text-sm text-slate-500">فاکتور و مبلغ دریافت‌شده جدا ثبت می‌شوند.</p></div><button @click="go('services')">✕</button></div><div class="grid md:grid-cols-2 gap-3 mt-5"><select x-model="serviceForm.customer_id" class="field md:col-span-2"><option value="">انتخاب مشتری *</option><template x-for="c in customers" :key="c.id"><option :value="c.id" x-text="c.name+' — '+((c.phones||[])[0]||'بدون شماره')+' — '+(c.address||'')"></option></template></select><input x-model="serviceForm.service_type" class="field" placeholder="نوع سرویس"><input x-model="serviceForm.visitor_code" class="field" placeholder="ویزیتور"><textarea x-model="serviceForm.description" class="field md:col-span-2" placeholder="شرح کار"></textarea><input x-model="serviceForm.invoice_amount" inputmode="numeric" class="field" placeholder="مبلغ فاکتور"><input x-model="serviceForm.received_amount" inputmode="numeric" class="field" placeholder="مبلغ دریافت‌شده"><select x-model="serviceForm.payment_method" class="field"><option value="">روش پرداخت</option><option>نقد</option><option>کارت</option><option>کارت‌به‌کارت</option><option>چک</option></select><select x-model="serviceForm.status" class="field"><option value="completed">تکمیل شده</option><option value="registered">ثبت شده</option><option value="revisit">نیاز به مراجعه</option></select><label class="text-sm">زمان سرویس<input x-model="serviceForm.visited_at" type="datetime-local" class="field mt-1"></label><label class="text-sm">سرویس بعدی<input x-model="serviceForm.next_service_at" type="datetime-local" class="field mt-1"></label></div><div class="mt-3 p-4 rounded-2xl bg-teal-50 text-sm">سهم شرکت: <b x-text="money(estimatedCompanyShare)+' تومان'"></b> • مانده مشتری: <b x-text="money(estimatedBalance)+' تومان'"></b></div><button @click="createService" class="btn primary w-full mt-4">ثبت سرویس</button></div></section>

<section x-show="page==='map'" class="space-y-4"><div class="flex flex-col md:flex-row justify-between gap-3"><div><h2 class="text-2xl font-black">نقشه زنده مشتری‌ها</h2><p class="text-sm text-slate-500">موقعیت زنده شما، مشتری‌های ثبت‌شده و نزدیک‌ترین گزینه بعدی</p></div><div class="flex flex-wrap gap-2 no-print"><button @click="liveLocate" class="btn primary">📍 موقعیت من</button><button @click="loadNearby" class="btn soft">اطراف من</button><button @click="loadRoutePlan" class="btn bg-blue-50 text-blue-700">🗺 مسیر پیشنهادی</button><button x-show="routePlan.length" @click="copyRoute" class="btn bg-slate-100">کپی مسیر</button></div></div><div class="card overflow-hidden"><div id="mainMap" style="height:60vh;min-height:430px"></div></div><div x-show="routePlan.length" class="card p-5"><h3 class="font-black mb-3">نزدیک‌ترین مشتری‌های بعدی</h3><template x-for="(r,i) in routePlan" :key="r.id"><div class="border-b py-3 grid grid-cols-[auto_1fr_auto] gap-3 items-center"><span class="w-8 h-8 rounded-full bg-blue-50 text-blue-700 grid place-items-center font-black" x-text="i+1"></span><div><b x-text="r.map_label||r.name"></b><div class="text-xs text-slate-500" x-text="[r.phone,r.address].filter(Boolean).join(' • ')"></div></div><span class="chip bg-blue-50 text-blue-700" x-text="r.distance_m+' متر'"></span></div></template></div><div x-show="nearby.length" class="grid md:grid-cols-2 xl:grid-cols-3 gap-3"><template x-for="n in nearby" :key="n.id"><div class="card p-4"><div class="flex justify-between"><b x-text="n.map_label||([n.first_name,n.last_name].filter(Boolean).join(' '))"></b><span class="chip bg-blue-50 text-blue-700" x-text="n.distance_m+' متر'"></span></div><div class="text-sm text-slate-500 mt-2" x-text="n.address"></div><div class="text-xs mt-2" x-text="'آخرین دریافتی: '+money(n.last_amount||0)"></div></div></template></div></section>

<section x-show="page==='expense'" class="space-y-4"><div><h2 class="text-2xl font-black">هزینه‌ها و خریدها</h2><p class="text-sm text-slate-500">خرید جنس، بنزین، پارکینگ، ابزار، غذا و متفرقه از سود خالص کم می‌شوند.</p></div><div class="grid lg:grid-cols-3 gap-4"><div class="card p-5"><div class="space-y-3"><select x-model="expenseForm.category" class="field"><option value="goods">خرید جنس/قطعه</option><option value="fuel">بنزین/سوخت</option><option value="parking">پارکینگ</option><option value="tools">ابزار/تعمیر</option><option value="food">غذا</option><option value="other">متفرقه</option></select><input x-model="expenseForm.title" class="field" placeholder="عنوان هزینه"><input x-model="expenseForm.amount" class="field" inputmode="numeric" placeholder="مبلغ"><input x-model="expenseForm.expense_date" type="datetime-local" class="field"><textarea x-model="expenseForm.notes" class="field" placeholder="توضیحات"></textarea><button @click="createExpense" class="btn primary w-full">ثبت هزینه</button></div></div><div class="lg:col-span-2 card p-5"><h3 class="font-black mb-3">آخرین هزینه‌ها</h3><template x-for="e in expenses" :key="e.id"><div class="border-b py-3 flex justify-between"><div><b x-text="e.title"></b><div class="text-xs text-slate-500" x-text="expenseCategory(e.category)+' • '+persianDateTime(e.expense_date)"></div></div><div class="text-left"><b x-text="money(e.amount)+' تومان'"></b><button @click="removeExpense(e)" class="text-xs text-red-600 block no-print">حذف</button></div></div></template></div></div></section>

<section x-show="page==='finance'" class="space-y-4"><div class="flex flex-col md:flex-row justify-between gap-3"><div><h2 class="text-2xl font-black">تحلیل مالی و سود و زیان</h2><p class="text-sm text-slate-500">ماهانه و سالانه بر اساس تقویم شمسی</p></div><div class="flex gap-2 no-print"><button @click="downloadExcel" class="btn soft">⬇️ Excel</button><button @click="printPdf" class="btn bg-slate-100">🖨 PDF/چاپ</button></div></div><div class="grid grid-cols-2 lg:grid-cols-6 gap-3"><template x-for="x in financeCards" :key="x.label"><div class="card p-4"><small class="text-slate-500" x-text="x.label"></small><b class="block text-lg mono" :class="x.cls" x-text="money(x.value)"></b></div></template></div><div class="grid lg:grid-cols-2 gap-4"><div class="card p-5"><h3 class="font-black mb-3">ماهانه شمسی</h3><canvas id="monthlyChart"></canvas></div><div class="card p-5"><h3 class="font-black mb-3">سالانه شمسی</h3><canvas id="yearlyChart"></canvas></div><div class="card p-5 lg:col-span-2"><h3 class="font-black mb-3">سرویس‌های پرفروش</h3><canvas id="serviceChart"></canvas></div></div><div class="grid lg:grid-cols-2 gap-4"><div class="card p-5"><h3 class="font-black">ثبت تسویه با شرکت</h3><div class="grid gap-3 mt-3"><input x-model="settlementForm.amount" class="field" inputmode="numeric" placeholder="مبلغ پرداخت‌شده"><input x-model="settlementForm.settled_at" type="datetime-local" class="field"><textarea x-model="settlementForm.notes" class="field" placeholder="توضیح"></textarea><button @click="createSettlement" class="btn primary">ثبت تسویه</button></div></div><div class="card p-5"><h3 class="font-black">سابقه تسویه</h3><template x-for="s in settlements.slice(0,10)" :key="s.id"><div class="border-b py-3 flex justify-between"><span x-text="persianDateTime(s.settled_at)"></span><b x-text="money(s.amount)+' تومان'"></b></div></template></div></div></section>

<section x-show="page==='insights'" class="space-y-4"><div><h2 class="text-2xl font-black">تحلیل هوشمند کسب‌وکار</h2><p class="text-sm text-slate-500">مشتری‌های پردرآمد، مناطق پرتکرار، روزهای شلوغ، هزینه‌ها و میانگین سرویس‌ها</p></div><div class="grid lg:grid-cols-2 gap-4"><div class="card p-5"><h3 class="font-black mb-3">مشتری‌های پردرآمد</h3><template x-for="(c,i) in insights.top_customers||[]" :key="c.id"><div class="border-b py-3 flex justify-between"><span><b x-text="(i+1)+'. '+c.name"></b><small class="block text-slate-500" x-text="c.services+' سرویس'"></small></span><b x-text="money(c.received)+' تومان'"></b></div></template></div><div class="card p-5"><h3 class="font-black mb-3">مناطق پرتکرار</h3><template x-for="a in insights.areas||[]" :key="a.area"><div class="border-b py-3 flex justify-between"><span x-text="a.area||'نامشخص'"></span><b x-text="a.customers+' مشتری'"></b></div></template></div><div class="card p-5"><h3 class="font-black mb-3">روزهای شلوغ</h3><template x-for="d in insights.busy_days||[]" :key="d.weekday"><div class="border-b py-3 flex justify-between"><span x-text="weekdayName(d.weekday)"></span><span><b x-text="d.services+' سرویس'"></b> • <span x-text="money(d.received)+' تومان'"></span></span></div></template></div><div class="card p-5"><h3 class="font-black mb-3">دسته‌های هزینه</h3><template x-for="e in insights.expense_categories||[]" :key="e.category"><div class="border-b py-3 flex justify-between"><span x-text="expenseCategory(e.category)"></span><b x-text="money(e.amount)+' تومان'"></b></div></template></div><div class="card p-5 lg:col-span-2"><h3 class="font-black mb-3">تحلیل نوع سرویس</h3><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-500"><th class="text-right p-2">سرویس</th><th>تعداد</th><th>میانگین دریافتی</th><th>جمع دریافتی</th></tr></thead><tbody><template x-for="s in insights.service_analysis||[]" :key="s.service_type"><tr class="border-t"><td class="p-2 font-bold" x-text="s.service_type"></td><td class="text-center" x-text="s.services"></td><td class="text-center" x-text="money(s.avg_received)"></td><td class="text-center" x-text="money(s.received)"></td></tr></template></tbody></table></div></div></div></section>

<section x-show="page==='smart'" class="space-y-4"><div><h2 class="text-2xl font-black">ثبت هوشمند ✨</h2><p class="text-sm text-slate-500">LLM واقعی در صورت وجود کلید AI؛ fallback محلی در زمان قطعی. هم‌فامیل هرگز خودکار یکی نمی‌شود.</p></div><div class="grid lg:grid-cols-2 gap-4"><div class="card p-5"><textarea x-model="smartText" class="field min-h-64" placeholder="یادداشت نامرتب سرویس را اینجا بنویس…"></textarea><div class="grid grid-cols-2 gap-2 mt-3"><button @click="analyzeSmart" class="btn bg-violet-600 text-white">✨ تحلیل</button><button @click="captureSmartGps" class="btn soft">📍 GPS</button></div></div><div class="card p-5"><h3 class="font-black">نتیجه</h3><template x-if="smartParsed"><div class="mt-3"><template x-for="r in smartRows" :key="r[0]"><div class="border-b py-2 flex justify-between gap-3"><span class="text-slate-500" x-text="r[0]"></span><b class="text-left" x-text="r[1]||'—'"></b></div></template><div x-show="smartSuggestions.length" class="mt-4"><b class="text-sm">مشتری مشابه — فقط اگر مطمئنی انتخاب کن:</b><label class="block p-2 border rounded-xl mt-2"><input type="radio" x-model="smartCustomerId" value=""> مشتری جدید</label><template x-for="s in smartSuggestions" :key="s.id"><label class="block p-2 border rounded-xl mt-2"><input type="radio" x-model="smartCustomerId" :value="s.id"> <b x-text="[s.first_name,s.last_name].filter(Boolean).join(' ')"></b> — <span x-text="s.phone||s.address||''"></span></label></template></div><button @click="registerSmart" class="btn primary w-full mt-4">ثبت هوشمند</button></div></template><div x-show="!smartParsed" class="text-center text-slate-400 py-16">هنوز تحلیلی انجام نشده</div></div></div></section>

<section x-show="page==='reminders'" class="space-y-4"><div><h2 class="text-2xl font-black">یادآوری سرویس بعدی</h2><p class="text-sm text-slate-500">موعدهای نزدیک برای تماس دوباره با مشتری</p></div><div class="grid md:grid-cols-2 gap-3"><template x-for="r in reminders" :key="r.id"><div class="card p-4"><b x-text="r.name"></b><div class="text-sm text-slate-500" x-text="[r.phone,r.address].filter(Boolean).join(' • ')"></div><div class="mt-2 text-teal-700 font-bold" x-text="persianDateTime(r.next_service_at)"></div></div></template><div x-show="!reminders.length" class="card p-10 text-center text-slate-400">موعدی در بازه نزدیک نیست</div></div></section>

<section x-show="page==='settings'" class="max-w-3xl mx-auto space-y-4"><div class="card p-5"><h2 class="text-2xl font-black">تنظیمات مالی</h2><label class="text-sm block mt-4">درصد سهم شرکت<input x-model.number="financeSettings.company_share_percent" type="number" min="0" max="100" step="0.5" class="field mt-1"></label><button @click="saveFinanceSettings" class="btn primary w-full mt-3">ذخیره</button></div><div class="card p-5"><h3 class="font-black mb-3">آخرین تغییرات ثبت‌شده</h3><template x-for="a in auditRows.slice(0,15)" :key="a.id"><div class="border-b py-2 text-sm flex justify-between"><span><b x-text="a.action"></b> • <span x-text="a.entity_type"></span></span><span class="text-slate-400" x-text="persianDateTime(a.created_at)"></span></div></template></div></section>

</main></div></template>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script>
</body></html>
