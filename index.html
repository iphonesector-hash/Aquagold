<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AquaGold CRM v3</title><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script><script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
body{font-family:Vazirmatn,system-ui,sans-serif;background:#f6f8fa;color:#0f172a}[x-cloak]{display:none!important}.glass{background:rgba(255,255,255,.93);backdrop-filter:blur(14px)}.card{background:white;border:1px solid #e6edf2;border-radius:22px;box-shadow:0 8px 28px rgba(15,23,42,.05)}.field{width:100%;border:1px solid #d8e1e8;border-radius:14px;padding:.78rem .9rem;background:#fff;outline:none}.field:focus{border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.12)}.btn{border-radius:14px;padding:.72rem 1rem;font-weight:800}.primary{background:#0f766e;color:#fff}.soft{background:#ecfdf5;color:#0f766e}.navon{background:#0f766e;color:#fff}.chip{border-radius:999px;padding:.28rem .65rem;font-size:.72rem}.safe{padding-bottom:max(1rem,env(safe-area-inset-bottom))}.maplibregl-popup-content{font-family:Vazirmatn!important;border-radius:14px!important}.mono{font-variant-numeric:tabular-nums}
</style>
</head>
<body x-data="app()" x-init="init()" x-cloak>
<template x-if="!token"><main class="min-h-screen grid place-items-center p-5 bg-gradient-to-br from-teal-900 via-teal-700 to-cyan-700"><section class="glass w-full max-w-md rounded-[30px] p-7 shadow-2xl"><div class="w-16 h-16 rounded-2xl bg-teal-700 text-white grid place-items-center text-3xl">💧</div><h1 class="text-3xl font-black mt-4">AquaGold</h1><p class="text-slate-500">CRM هوشمند خدمات تصفیه آب</p><form @submit.prevent="login" class="space-y-3 mt-7"><input x-model="loginForm.username" class="field" placeholder="نام کاربری"><input x-model="loginForm.password" type="password" class="field" placeholder="رمز عبور"><p x-show="error" x-text="error" class="text-red-600 text-sm"></p><button class="btn primary w-full" x-text="busy?'در حال ورود…':'ورود به پنل'"></button></form></section></main></template>

<template x-if="token"><div class="min-h-screen">
<header class="sticky top-0 z-50 glass border-b border-slate-200 px-4 py-3"><div class="max-w-7xl mx-auto flex justify-between items-center"><div><b class="text-xl">AquaGold</b><div class="text-xs text-slate-500">مالی • مشتری • سرویس • نقشه</div></div><div class="flex gap-2 items-center"><span class="hidden sm:block text-sm" x-text="userName"></span><button @click="logout" class="btn bg-red-50 text-red-600 !py-2">خروج</button></div></div></header>
<nav class="sticky top-[65px] z-40 glass border-b border-slate-200 p-2 overflow-x-auto"><div class="max-w-7xl mx-auto flex gap-2 min-w-max"><template x-for="n in navs" :key="n.id"><button @click="go(n.id)" class="btn !py-2 !px-3" :class="page===n.id?'navon':'bg-white border text-slate-600'"><span x-text="n.icon"></span> <span x-text="n.label"></span></button></template></div></nav>
<main class="max-w-7xl mx-auto p-4 md:p-7 safe space-y-5">

<!-- DASHBOARD -->
<section x-show="page==='dashboard'" class="space-y-5">
<div class="grid grid-cols-2 lg:grid-cols-5 gap-3"><div class="card p-4"><div class="text-xs text-slate-500">دریافتی امروز</div><div class="text-xl font-black mono" x-text="money(stats.today?.received)"></div></div><div class="card p-4"><div class="text-xs text-slate-500">سهم شرکت امروز</div><div class="text-xl font-black mono" x-text="money(stats.today?.company_share)"></div></div><div class="card p-4"><div class="text-xs text-slate-500">هزینه امروز</div><div class="text-xl font-black mono" x-text="money(stats.today?.expenses)"></div></div><div class="card p-4"><div class="text-xs text-slate-500">سود خالص امروز</div><div class="text-xl font-black text-emerald-700 mono" x-text="money(stats.today?.net_profit)"></div></div><div class="card p-4 col-span-2 lg:col-span-1"><div class="text-xs text-slate-500">مشتری‌ها</div><div class="text-xl font-black" x-text="stats.total_customers||0"></div></div></div>
<div class="grid lg:grid-cols-3 gap-4"><div class="card p-5 lg:col-span-2"><div class="flex justify-between"><h2 class="font-black text-lg">کارهای اخیر</h2><button @click="go('daily')" class="text-teal-700 text-sm">گزارش روزانه</button></div><template x-for="j in jobs.slice(0,7)" :key="j.id"><div class="border-b py-3 flex justify-between gap-3"><div><b x-text="j.name"></b><div class="text-xs text-slate-500" x-text="j.description||j.service_type||'سرویس'"></div><div class="text-xs text-slate-400" x-text="persianDateTime(j.date)"></div></div><div class="text-left"><b x-text="money(j.received_amount)+' تومان'"></b><div class="text-xs text-slate-400" x-text="'شرکت: '+money(j.company_share_amount)"></div></div></div></template><div x-show="!jobs.length" class="text-center text-slate-400 py-8">هنوز سرویسی ثبت نشده</div></div>
<div class="card p-5"><h2 class="font-black mb-3">دسترسی سریع</h2><div class="grid gap-2"><button @click="newCustomer()" class="btn primary">＋ مشتری جدید</button><button @click="go('new-service')" class="btn soft">🧾 سرویس جدید</button><button @click="go('smart')" class="btn bg-violet-50 text-violet-700">✨ ثبت هوشمند</button><button @click="go('expense')" class="btn bg-amber-50 text-amber-700">💸 ثبت هزینه/خرید</button><button @click="go('map')" class="btn bg-blue-50 text-blue-700">📍 نقشه زنده</button></div></div></div>
</section>

<!-- DAILY REPORTS -->
<section x-show="page==='daily'" class="space-y-4"><div class="flex flex-col md:flex-row md:justify-between gap-3"><div><h2 class="text-2xl font-black">گزارش روزانه شمسی</h2><p class="text-sm text-slate-500">سرویس‌ها بر اساس روز؛ جمع دریافتی، سهم شرکت، هزینه و سود خالص</p></div><button @click="copyAllDaily" class="btn soft">📋 کپی گزارش روزها</button></div>
<div class="space-y-4"><template x-for="d in dailyGroups" :key="d.iso"><article class="card overflow-hidden"><div class="p-4 bg-slate-50 flex flex-wrap justify-between gap-2"><div><b class="text-lg" x-text="persianDate(d.iso)"></b><div class="text-xs text-slate-500" x-text="d.services+' سرویس'"></div></div><button @click="copyDay(d)" class="btn bg-white border !py-2">کپی این روز</button></div><div class="divide-y"><template x-for="j in d.jobs" :key="j.id"><div class="p-4 grid md:grid-cols-[1fr_auto] gap-2"><div><b x-text="j.name"></b><div class="text-sm text-slate-600" x-text="j.description||j.service_type||'سرویس'"></div><div class="text-xs text-slate-400" x-text="[j.phone,j.address].filter(Boolean).join(' • ')"></div></div><div class="text-left"><b x-text="money(j.received_amount)+' تومان'"></b><div class="text-xs text-slate-500" x-text="'سهم شرکت: '+money(j.company_share_amount)"></div></div></div></template></div><div class="p-4 grid grid-cols-2 md:grid-cols-5 gap-3 bg-teal-50"><div><small>جمع دریافتی</small><b class="block" x-text="money(d.received)"></b></div><div><small>سهم شرکت</small><b class="block" x-text="money(d.company_share)"></b></div><div><small>هزینه‌ها</small><b class="block" x-text="money(d.expenses)"></b></div><div><small>مانده مشتری‌ها</small><b class="block" x-text="money(d.customer_balance)"></b></div><div><small>سود خالص من</small><b class="block text-emerald-700" x-text="money(d.net_profit)"></b></div></div></article></template><div x-show="!dailyGroups.length" class="card p-10 text-center text-slate-400">گزارشی وجود ندارد</div></div></section>

<!-- CUSTOMERS -->
<section x-show="page==='customers'" class="space-y-4"><div class="flex justify-between items-end"><div><h2 class="text-2xl font-black">مشتریان</h2><p class="text-sm text-slate-500">هر مشتری ID مستقل دارد؛ هم‌فامیل‌ها هرگز خودکار ادغام نمی‌شوند.</p></div><button @click="newCustomer()" class="btn primary">＋ مشتری</button></div><div class="card p-4"><input x-model="customerSearch" class="field" placeholder="نام، شماره، آدرس، پلاک، واحد یا نام روی نقشه…"></div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-3"><template x-for="c in filteredCustomers" :key="c.id"><div class="card p-4"><div class="flex justify-between gap-2"><div><b class="text-lg" x-text="c.name"></b><div class="text-xs text-slate-500" x-text="(c.phones||[]).join(' • ')||'بدون شماره'"></div></div><span x-show="c.latitude" class="chip bg-emerald-50 text-emerald-700 h-fit">GPS ✓</span></div><div class="text-sm text-slate-500 mt-3" x-text="c.address||'بدون آدرس'"></div><div class="text-xs text-slate-400 mt-1" x-show="c.map_label" x-text="'نام روی نقشه: '+c.map_label"></div><div class="grid grid-cols-3 gap-2 mt-4"><button @click="openCustomer(c)" class="btn bg-slate-50 !py-2">تاریخچه</button><button @click="editCustomer(c)" class="btn soft !py-2">ویرایش</button><button @click="serviceFor(c)" class="btn primary !py-2">سرویس</button></div></div></template></div></section>

<!-- CUSTOMER EDITOR -->
<section x-show="page==='customer-edit'" class="max-w-5xl mx-auto space-y-4"><div class="card p-5"><div class="flex justify-between"><div><h2 class="text-2xl font-black" x-text="customerEdit.id?'ویرایش مشتری':'ثبت مشتری جدید'"></h2><p class="text-sm text-slate-500">GPS فعلی، انتخاب روی نقشه، جابه‌جایی marker یا ورود دستی مختصات</p></div><button @click="go('customers')">✕</button></div><div class="grid md:grid-cols-2 gap-3 mt-5"><input x-model="customerEdit.first_name" class="field" placeholder="نام"><input x-model="customerEdit.last_name" class="field" placeholder="نام خانوادگی *"><input x-model="customerEdit.phone" class="field" placeholder="شماره اصلی"><input x-model="customerEdit.phone2" class="field" placeholder="شماره دوم"><input x-model="customerEdit.map_label" class="field" placeholder="نام نمایشی روی نقشه"><input x-model="customerEdit.device_model" class="field" placeholder="مدل دستگاه"><input x-model="customerEdit.plaque" class="field" placeholder="پلاک"><input x-model="customerEdit.unit_no" class="field" placeholder="واحد"><textarea x-model="customerEdit.address" class="field md:col-span-2 min-h-24" placeholder="آدرس کامل"></textarea><textarea x-model="customerEdit.notes" class="field md:col-span-2" placeholder="یادداشت"></textarea></div>
<div class="mt-5 grid lg:grid-cols-3 gap-3"><div class="lg:col-span-2 rounded-2xl overflow-hidden border"><div id="editMap" style="height:390px"></div></div><div class="space-y-3"><button @click="captureEditGps" class="btn primary w-full">📍 استفاده از GPS فعلی</button><p class="text-xs text-slate-500">روی نقشه بزن یا marker را با انگشت جابه‌جا کن.</p><input x-model.number="customerEdit.latitude" type="number" step="any" class="field" placeholder="Latitude"><input x-model.number="customerEdit.longitude" type="number" step="any" class="field" placeholder="Longitude"><button @click="applyManualCoords" class="btn soft w-full">اعمال مختصات دستی</button><div class="text-xs text-slate-500" x-text="customerEdit.latitude?'موقعیت آماده ثبت است':'هنوز موقعیتی انتخاب نشده'"></div></div></div><button @click="saveCustomer" class="btn primary w-full mt-5" x-text="busy?'در حال ذخیره…':'ذخیره مشتری'"></button></div></section>

<!-- CUSTOMER DETAIL -->
<section x-show="page==='customer-detail'&&selectedCustomer" class="max-w-4xl mx-auto space-y-4"><div class="card p-5"><div class="flex justify-between"><div><h2 class="text-2xl font-black" x-text="selectedCustomer?.name"></h2><p class="text-sm text-slate-500" x-text="(selectedCustomer?.phones||[]).join(' • ')"></p></div><button @click="go('customers')">✕</button></div><div class="grid md:grid-cols-2 gap-3 mt-4"><div class="bg-slate-50 p-4 rounded-2xl"><small>آدرس</small><b class="block" x-text="selectedCustomer?.address||'—'"></b></div><div class="bg-slate-50 p-4 rounded-2xl"><small>نقشه</small><b class="block" x-text="selectedCustomer?.map_label||selectedCustomer?.name"></b></div></div><div class="flex gap-2 mt-4"><button @click="editCustomer(selectedCustomer)" class="btn soft">ویرایش</button><button @click="serviceFor(selectedCustomer)" class="btn primary">سرویس جدید</button><button x-show="selectedCustomer?.latitude" @click="showOnMap(selectedCustomer)" class="btn bg-blue-50 text-blue-700">روی نقشه</button></div></div><div class="card p-5"><h3 class="font-black">تاریخچه سرویس</h3><template x-for="j in selectedCustomerJobs" :key="j.id"><div class="border-b py-3 flex justify-between"><div><b x-text="j.description||j.service_type"></b><div class="text-xs text-slate-400" x-text="persianDateTime(j.date)"></div></div><div class="text-left"><b x-text="money(j.received_amount)"></b><div class="text-xs" x-text="'مانده: '+money(j.customer_balance)"></div></div></div></template></div></section>

<!-- SERVICES -->
<section x-show="page==='services'" class="space-y-4"><div class="flex justify-between"><div><h2 class="text-2xl font-black">سرویس‌ها</h2><p class="text-sm text-slate-500">فاکتور، دریافتی، سهم شرکت، مانده و یادآوری</p></div><button @click="go('new-service')" class="btn primary">＋ سرویس</button></div><div class="card p-4"><input x-model="serviceSearch" class="field" placeholder="جست‌وجوی مشتری، سرویس، تلفن یا آدرس…"></div><div class="space-y-3"><template x-for="j in filteredJobs" :key="j.id"><div class="card p-4 grid md:grid-cols-[1fr_auto] gap-3"><div><b x-text="j.name"></b><div class="text-sm" x-text="j.description||j.service_type||'سرویس'"></div><div class="text-xs text-slate-400" x-text="[j.phone,persianDateTime(j.date)].filter(Boolean).join(' • ')"></div></div><div class="text-left text-sm"><div><b x-text="money(j.received_amount)+' تومان'"></b></div><div x-text="'فاکتور: '+money(j.invoice_amount)"></div><div x-text="'شرکت: '+money(j.company_share_amount)"></div><div x-show="j.customer_balance>0" class="text-red-600" x-text="'مانده: '+money(j.customer_balance)"></div></div></div></template></div></section>

<!-- NEW SERVICE -->
<section x-show="page==='new-service'" class="max-w-4xl mx-auto"><div class="card p-5"><div class="flex justify-between"><div><h2 class="text-2xl font-black">ثبت سرویس</h2><p class="text-sm text-slate-500">مبلغ فاکتور و مبلغ دریافت‌شده جدا ثبت می‌شوند.</p></div><button @click="go('services')">✕</button></div><div class="grid md:grid-cols-2 gap-3 mt-5"><select x-model="serviceForm.customer_id" class="field md:col-span-2"><option value="">انتخاب مشتری *</option><template x-for="c in customers" :key="c.id"><option :value="c.id" x-text="c.name+' — '+((c.phones||[])[0]||'بدون شماره')+' — '+(c.address||'')"></option></template></select><input x-model="serviceForm.service_type" class="field" placeholder="نوع سرویس"><input x-model="serviceForm.visitor_code" class="field" placeholder="ویزیتور"><textarea x-model="serviceForm.description" class="field md:col-span-2" placeholder="شرح کار"></textarea><input x-model="serviceForm.invoice_amount" inputmode="numeric" class="field" placeholder="مبلغ فاکتور"><input x-model="serviceForm.received_amount" inputmode="numeric" class="field" placeholder="مبلغ دریافت‌شده"><select x-model="serviceForm.payment_method" class="field"><option value="">روش پرداخت</option><option>نقد</option><option>کارت</option><option>کارت‌به‌کارت</option><option>چک</option></select><select x-model="serviceForm.status" class="field"><option value="completed">تکمیل شده</option><option value="registered">ثبت شده</option><option value="revisit">نیاز به مراجعه</option></select><label class="text-sm">زمان سرویس<input x-model="serviceForm.visited_at" type="datetime-local" class="field mt-1"></label><label class="text-sm">یادآوری سرویس بعدی<input x-model="serviceForm.next_service_at" type="datetime-local" class="field mt-1"></label></div><div class="mt-3 p-4 rounded-2xl bg-teal-50 text-sm"><span>سهم شرکت با درصد فعلی: </span><b x-text="money(estimatedCompanyShare)+' تومان'"></b><span class="mx-2">•</span><span>مانده مشتری: </span><b x-text="money(estimatedBalance)+' تومان'"></b></div><button @click="createService" class="btn primary w-full mt-4">ثبت سرویس</button></div></section>

<!-- MAP -->
<section x-show="page==='map'" class="space-y-4"><div class="flex flex-col md:flex-row justify-between gap-3"><div><h2 class="text-2xl font-black">نقشه زنده مشتری‌ها</h2><p class="text-sm text-slate-500">موقعیت زنده شما + مشتری‌های ذخیره‌شده؛ برای ویرایش نقطه، از ویرایش مشتری استفاده کن.</p></div><div class="flex gap-2"><button @click="liveLocate" class="btn primary">📍 موقعیت من</button><button @click="loadNearby" class="btn soft">اطراف من</button></div></div><div class="card overflow-hidden"><div id="mainMap" style="height:62vh;min-height:430px"></div></div><div x-show="nearby.length" class="grid md:grid-cols-2 xl:grid-cols-3 gap-3"><template x-for="n in nearby" :key="n.id"><div class="card p-4"><div class="flex justify-between"><b x-text="n.map_label||([n.first_name,n.last_name].filter(Boolean).join(' '))"></b><span class="chip bg-blue-50 text-blue-700" x-text="n.distance_m+' متر'"></span></div><div class="text-sm text-slate-500 mt-2" x-text="n.address"></div><div class="text-xs mt-2" x-text="'آخرین دریافتی: '+money(n.last_amount||0)"></div></div></template></div></section>

<!-- EXPENSES -->
<section x-show="page==='expense'" class="space-y-4"><div><h2 class="text-2xl font-black">هزینه‌ها و خریدها</h2><p class="text-sm text-slate-500">خرید فیلتر و قطعه، بنزین، پارکینگ، ابزار، غذا و سایر هزینه‌ها مستقیماً از سود کم می‌شوند.</p></div><div class="grid lg:grid-cols-3 gap-4"><div class="card p-5"><div class="space-y-3"><select x-model="expenseForm.category" class="field"><option value="goods">خرید جنس/قطعه</option><option value="fuel">بنزین/سوخت</option><option value="parking">پارکینگ</option><option value="tools">ابزار/تعمیر</option><option value="food">غذا</option><option value="other">متفرقه</option></select><input x-model="expenseForm.title" class="field" placeholder="عنوان هزینه"><input x-model="expenseForm.amount" inputmode="numeric" class="field" placeholder="مبلغ"><input x-model="expenseForm.expense_date" type="datetime-local" class="field"><textarea x-model="expenseForm.notes" class="field" placeholder="توضیحات"></textarea><button @click="createExpense" class="btn primary w-full">ثبت هزینه</button></div></div><div class="lg:col-span-2 card p-5"><h3 class="font-black mb-3">آخرین هزینه‌ها</h3><template x-for="e in expenses" :key="e.id"><div class="border-b py-3 flex justify-between gap-3"><div><b x-text="e.title"></b><div class="text-xs text-slate-500" x-text="expenseCategory(e.category)+' • '+persianDateTime(e.expense_date)"></div></div><div class="text-left"><b x-text="money(e.amount)+' تومان'"></b><button @click="removeExpense(e)" class="block text-xs text-red-600 mt-1">حذف</button></div></div></template></div></div></section>

<!-- FINANCE -->
<section x-show="page==='finance'" class="space-y-4"><div><h2 class="text-2xl font-black">تحلیل مالی و سود و زیان</h2><p class="text-sm text-slate-500">فروش، دریافتی، سهم شرکت، هزینه‌ها، سود خالص و مانده تسویه</p></div><div class="grid grid-cols-2 lg:grid-cols-6 gap-3"><template x-for="x in financeCards" :key="x.label"><div class="card p-4"><small class="text-slate-500" x-text="x.label"></small><b class="block text-lg mono" :class="x.cls" x-text="money(x.value)"></b></div></template></div><div class="grid lg:grid-cols-2 gap-4"><div class="card p-5"><h3 class="font-black mb-3">درآمد و سود ماهانه</h3><canvas id="monthlyChart" height="180"></canvas></div><div class="card p-5"><h3 class="font-black mb-3">نوع سرویس‌های پرفروش</h3><canvas id="serviceChart" height="180"></canvas></div></div><div class="grid lg:grid-cols-2 gap-4"><div class="card p-5"><h3 class="font-black">ثبت تسویه با شرکت</h3><div class="grid gap-3 mt-3"><input x-model="settlementForm.amount" class="field" inputmode="numeric" placeholder="مبلغ پرداخت‌شده به شرکت"><input x-model="settlementForm.settled_at" type="datetime-local" class="field"><textarea x-model="settlementForm.notes" class="field" placeholder="توضیح"></textarea><button @click="createSettlement" class="btn primary">ثبت تسویه</button></div></div><div class="card p-5"><h3 class="font-black">سابقه تسویه</h3><template x-for="s in settlements.slice(0,10)" :key="s.id"><div class="border-b py-3 flex justify-between"><span x-text="persianDateTime(s.settled_at)"></span><b x-text="money(s.amount)+' تومان'"></b></div></template></div></div></section>

<!-- SMART -->
<section x-show="page==='smart'" class="space-y-4"><div><h2 class="text-2xl font-black">ثبت هوشمند ✨</h2><p class="text-sm text-slate-500">نام خانوادگی مشابه هیچ‌وقت باعث انتخاب خودکار مشتری نمی‌شود؛ شماره دقیق اولویت دارد و بقیه فقط پیشنهادند.</p></div><div class="grid lg:grid-cols-2 gap-4"><div class="card p-5"><textarea x-model="smartText" class="field min-h-64" placeholder="یادداشت نامرتب سرویس را اینجا بچسبان…"></textarea><div class="grid grid-cols-2 gap-2 mt-3"><button @click="analyzeSmart" class="btn bg-violet-600 text-white">✨ تحلیل</button><button @click="captureSmartGps" class="btn soft">📍 GPS</button></div></div><div class="card p-5"><h3 class="font-black">نتیجه</h3><template x-if="smartParsed"><div class="mt-3 space-y-2"><template x-for="r in smartRows" :key="r[0]"><div class="border-b py-2 flex justify-between gap-3"><span class="text-slate-500" x-text="r[0]"></span><b class="text-left" x-text="r[1]||'—'"></b></div></template><div x-show="smartSuggestions.length" class="mt-4"><div class="text-sm font-bold">مشتری‌های مشابه — فقط اگر مطمئنی انتخاب کن:</div><label class="block p-2 border rounded-xl mt-2"><input type="radio" x-model="smartCustomerId" value=""> مشتری جدید</label><template x-for="s in smartSuggestions" :key="s.id"><label class="block p-2 border rounded-xl mt-2"><input type="radio" x-model="smartCustomerId" :value="s.id"> <b x-text="[s.first_name,s.last_name].filter(Boolean).join(' ')"></b> — <span x-text="s.phone||s.address||''"></span></label></template></div><button @click="registerSmart" class="btn primary w-full mt-4">ثبت هوشمند</button></div></template><div x-show="!smartParsed" class="text-center text-slate-400 py-16">هنوز تحلیلی انجام نشده</div></div></div></section>

<!-- REMINDERS -->
<section x-show="page==='reminders'" class="space-y-4"><div><h2 class="text-2xl font-black">یادآوری سرویس بعدی</h2><p class="text-sm text-slate-500">مشتری‌هایی که موعد سرویس‌شان نزدیک شده</p></div><div class="grid md:grid-cols-2 gap-3"><template x-for="r in reminders" :key="r.id"><div class="card p-4"><b x-text="r.name"></b><div class="text-sm text-slate-500" x-text="r.phone+' • '+(r.address||'')"></div><div class="mt-2 text-teal-700 font-bold" x-text="persianDateTime(r.next_service_at)"></div></div></template><div x-show="!reminders.length" class="card p-10 text-center text-slate-400">موعدی در بازه نزدیک نیست</div></div></section>

<!-- SETTINGS -->
<section x-show="page==='settings'" class="max-w-xl mx-auto"><div class="card p-5"><h2 class="text-2xl font-black">تنظیمات مالی</h2><p class="text-sm text-slate-500">درصد سهم شرکت برای سرویس‌های جدید؛ مقدار فعلی قابل تغییر است.</p><div class="mt-5"><label class="text-sm">درصد سهم شرکت</label><input x-model.number="financeSettings.company_share_percent" type="number" min="0" max="100" step="0.5" class="field mt-1"><button @click="saveFinanceSettings" class="btn primary w-full mt-3">ذخیره تنظیمات</button></div></div></section>

</main></div></template>
<script>
function app(){return{
token:localStorage.getItem('token'),user:JSON.parse(localStorage.getItem('user')||'null'),page:'dashboard',busy:false,error:'',stats:{today:{},total_customers:0},jobs:[],customers:[],expenses:[],settlements:[],dailyRows:[],analytics:{totals:{},months:[],service_types:[]},reminders:[],nearby:[],loginForm:{username:'',password:''},customerSearch:'',serviceSearch:'',selectedCustomer:null,customerEdit:{},serviceForm:{customer_id:'',service_type:'',description:'',invoice_amount:'',received_amount:'',payment_method:'',status:'completed',visited_at:'',next_service_at:'',visitor_code:''},expenseForm:{category:'goods',title:'',amount:'',expense_date:'',notes:''},settlementForm:{amount:'',settled_at:'',notes:''},financeSettings:{company_share_percent:50},gps:{},smartText:'',smartParsed:null,smartGps:{},smartSuggestions:[],smartCustomerId:'',mainMap:null,mainMarkers:[],userMarker:null,editMap:null,editMarker:null,monthlyChart:null,serviceChart:null,

get userName(){return [this.user?.first_name,this.user?.last_name].filter(Boolean).join(' ')||this.user?.username||''},get filteredCustomers(){let q=this.customerSearch.trim().toLowerCase();if(!q)return this.customers;return this.customers.filter(c=>[c.name,(c.phones||[]).join(' '),c.address,c.map_label,c.plaque,c.unit_no,c.device_model].join(' ').toLowerCase().includes(q))},get filteredJobs(){let q=this.serviceSearch.trim().toLowerCase();if(!q)return this.jobs;return this.jobs.filter(j=>[j.name,j.phone,j.address,j.description,j.service_type].join(' ').toLowerCase().includes(q))},get selectedCustomerJobs(){return this.selectedCustomer?this.jobs.filter(j=>String(j.customer_id)===String(this.selectedCustomer.id)):[]},
get estimatedCompanyShare(){let r=this.num(this.serviceForm.received_amount||this.serviceForm.invoice_amount);return Math.round(r*(Number(this.financeSettings.company_share_percent)||50)/100)},get estimatedBalance(){return Math.max(this.num(this.serviceForm.invoice_amount)-this.num(this.serviceForm.received_amount),0)},
get financeCards(){let t=this.analytics.totals||{};return[{label:'فروش/فاکتور',value:t.invoice},{label:'دریافتی',value:t.received},{label:'سهم شرکت',value:t.company_share},{label:'هزینه‌ها',value:t.expenses},{label:'سود خالص',value:t.net_profit,cls:'text-emerald-700'},{label:'بدهی شرکت',value:t.company_due,cls:'text-amber-700'}]},
get dailyGroups(){let by={};for(let j of this.jobs){let iso=this.isoDay(j.date);if(!by[iso])by[iso]={iso,jobs:[],services:0,received:0,company_share:0,customer_balance:0,expenses:0,net_profit:0};let d=by[iso];d.jobs.push(j);d.services++;d.received+=Number(j.received_amount||0);d.company_share+=Number(j.company_share_amount||0);d.customer_balance+=Number(j.customer_balance||0)}for(let e of this.expenses){let iso=this.isoDay(e.expense_date);if(!by[iso])by[iso]={iso,jobs:[],services:0,received:0,company_share:0,customer_balance:0,expenses:0,net_profit:0};by[iso].expenses+=Number(e.amount||0)}for(let d of Object.values(by))d.net_profit=d.received-d.company_share-d.expenses;return Object.values(by).sort((a,b)=>b.iso.localeCompare(a.iso))},

num(v){return Number(String(v||0).replace(/[٬،,\s]/g,''))||0},money(v){return new Intl.NumberFormat('fa-IR').format(Number(v||0))},persianDate(v){if(!v)return'';return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'long'}).format(new Date(v+'T12:00:00'))},persianDateTime(v){if(!v)return'';try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}},persianMonth(v){return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'short'}).format(new Date(v+'T12:00:00'))},isoDay(v){let d=new Date(v);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},
async api(path,opts={}){let h={'Content-Type':'application/json',...(opts.headers||{})};if(this.token)h.Authorization='Bearer '+this.token;let r=await fetch('/api'+path,{...opts,headers:h});let d={};try{d=await r.json()}catch{}if(r.status===401&&path!='/login'){this.logout();throw Error('نشست منقضی شد')}if(!r.ok){let e=new Error(d.error||'خطا در ارتباط با سرور');e.data=d;throw e}return d},
async init(){if(this.token){await this.refreshAll();this.locate(false)}},async login(){this.busy=true;this.error='';try{let d=await this.api('/login',{method:'POST',body:JSON.stringify(this.loginForm)});this.token=d.token;this.user=d.user;localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d.user));await this.refreshAll()}catch(e){this.error='نام کاربری یا رمز عبور نادرست است'}finally{this.busy=false}},logout(){localStorage.clear();location.reload()},

newCustomer(){this.customerEdit={id:null,first_name:'',last_name:'',phone:'',phone2:'',address:'',map_label:'',plaque:'',unit_no:'',device_model:'',notes:'',latitude:null,longitude:null,location_accuracy_m:null,location_source:null};this.page='customer-edit';setTimeout(()=>this.initEditMap(),100)},editCustomer(c){this.customerEdit={...c,phone:(c.phones||[])[0]||'',phone2:(c.phones||[])[1]||''};this.page='customer-edit';setTimeout(()=>this.initEditMap(),100)},async saveCustomer(){if(!this.customerEdit.last_name)return alert('نام خانوادگی لازم است');this.busy=true;try{let f=this.customerEdit;let payload={...f,phones:[f.phone,f.phone2].filter(Boolean)};let cid=f.id;if(cid){await this.api('/customers/'+cid,{method:'PATCH',body:JSON.stringify(payload)});if(f.latitude&&f.longitude)await this.api(`/customers/${cid}/location`,{method:'PATCH',body:JSON.stringify({latitude:f.latitude,longitude:f.longitude,accuracy:f.location_accuracy_m,source:f.location_source||'manual'})})}else{let d=await this.api('/customers',{method:'POST',body:JSON.stringify(payload)});cid=d.id}await this.refreshAll();this.page='customers';alert('مشتری ذخیره شد')}catch(e){alert(e.message)}finally{this.busy=false}},

initEditMap(){let el=document.getElementById('editMap');if(!el)return;if(this.editMap){this.editMap.remove();this.editMap=null}this.editMap=new maplibregl.Map({container:'editMap',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]},center:[this.customerEdit.longitude||51.389,this.customerEdit.latitude||35.6892],zoom:this.customerEdit.latitude?16:11});this.editMap.addControl(new maplibregl.NavigationControl(),'top-left');this.editMap.on('click',e=>{this.customerEdit.latitude=e.lngLat.lat;this.customerEdit.longitude=e.lngLat.lng;this.customerEdit.location_source='map';this.placeEditMarker()});this.placeEditMarker()},placeEditMarker(){if(!this.editMap||!this.customerEdit.latitude||!this.customerEdit.longitude)return;if(this.editMarker)this.editMarker.remove();this.editMarker=new maplibregl.Marker({draggable:true}).setLngLat([this.customerEdit.longitude,this.customerEdit.latitude]).addTo(this.editMap);this.editMarker.on('dragend',()=>{let p=this.editMarker.getLngLat();this.customerEdit.latitude=p.lat;this.customerEdit.longitude=p.lng;this.customerEdit.location_source='drag'});this.editMap.flyTo({center:[this.customerEdit.longitude,this.customerEdit.latitude],zoom:16})},
renderMainMap(){let el=document.getElementById('mainMap');if(!el)return;if(!this.mainMap){this.mainMap=new maplibregl.Map({container:'mainMap',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]},center:[51.389,35.6892],zoom:10});this.mainMap.addControl(new maplibregl.NavigationControl(),'top-left')}this.mainMarkers.forEach(m=>m.remove());this.mainMarkers=[];let pts=[];for(let c of this.customers.filter(x=>x.latitude&&x.longitude)){let label=c.map_label||c.name;let html=`<div dir="rtl"><b>${label}</b><br>${(c.phones||[]).join(' • ')}<br>${c.address||''}</div>`;let m=new maplibregl.Marker().setLngLat([c.longitude,c.latitude]).setPopup(new maplibregl.Popup({offset:20}).setHTML(html)).addTo(this.mainMap);this.mainMarkers.push(m);pts.push([c.longitude,c.latitude])}if(pts.length){let b=pts.reduce((bb,p)=>bb.extend(p),new maplibregl.LngLatBounds(pts[0],pts[0]));this.mainMap.fitBounds(b,{padding:50,maxZoom:15})}setTimeout(()=>this.mainMap.resize(),80)},async liveLocate(){try{let g=await this.locate();this.renderMainMap();if(this.userMarker)this.userMarker.remove();this.userMarker=new maplibregl.Marker({color:'#2563eb'}).setLngLat([g.lng,g.lat]).setPopup(new maplibregl.Popup().setHTML('<div dir="rtl"><b>موقعیت فعلی من</b></div>')).addTo(this.mainMap);this.mainMap.flyTo({center:[g.lng,g.lat],zoom:16})}catch{}},async loadNearby(){try{let g=await this.locate();this.nearby=await this.api(`/customers/nearby?lat=${g.lat}&lng=${g.lng}&radius=300`);await this.liveLocate()}catch(e){alert(e.message)}},showOnMap(c){this.page='map';setTimeout(()=>{this.renderMainMap();this.mainMap.flyTo({center:[c.longitude,c.latitude],zoom:17})},120)},
async createExpense(){try{let f={...this.expenseForm,amount:this.num(this.expenseForm.amount)};await this.api('/expenses',{method:'POST',body:JSON.stringify(f)});this.expenseForm={category:'goods',title:'',amount:'',expense_date:'',notes:''};await this.refreshAll();alert('هزینه ثبت شد')}catch(e){alert(e.message)}},async removeExpense(e){if(!confirm('این هزینه حذف شود؟'))return;await this.api('/expenses/'+e.id,{method:'DELETE'});await this.refreshAll()},expenseCategory(c){return({goods:'خرید جنس/قطعه',fuel:'بنزین/سوخت',parking:'پارکینگ',tools:'ابزار/تعمیر',food:'غذا',other:'متفرقه'})[c]||c},

renderCharts(){let months=this.analytics.months||[];let labels=months.map(m=>this.persianMonth(m.month));let canvas=document.getElementById('monthlyChart');if(canvas){if(this.monthlyChart)this.monthlyChart.destroy();this.monthlyChart=new Chart(canvas,{type:'line',data:{labels,datasets:[{label:'دریافتی',data:months.map(m=>m.received)},{label:'سود خالص',data:months.map(m=>m.net_profit)},{label:'هزینه',data:months.map(m=>m.expenses)}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}})}let types=this.analytics.service_types||[];let c2=document.getElementById('serviceChart');if(c2){if(this.serviceChart)this.serviceChart.destroy();this.serviceChart=new Chart(c2,{type:'bar',data:{labels:types.map(x=>x.service_type||'نامشخص'),datasets:[{label:'دریافتی',data:types.map(x=>x.received)}]},options:{responsive:true,plugins:{legend:{display:false}}}})}},
copyText(t){navigator.clipboard?.writeText(t).then(()=>alert('گزارش کپی شد')).catch(()=>prompt('متن گزارش:',t))},dayReportText(d){let lines=[`📅 ${this.persianDate(d.iso)}`];d.jobs.forEach((j,i)=>lines.push(`${i+1}) ${j.name} — ${j.description||j.service_type||'سرویس'} — ${this.money(j.received_amount)} تومان`));lines.push(`\nجمع دریافتی: ${this.money(d.received)} تومان`,`سهم شرکت: ${this.money(d.company_share)} تومان`,`هزینه‌ها: ${this.money(d.expenses)} تومان`,`مانده مشتری‌ها: ${this.money(d.customer_balance)} تومان`,`سود خالص من: ${this.money(d.net_profit)} تومان`);return lines.join('\n')},copyDay(d){this.copyText(this.dayReportText(d))},copyAllDaily(){this.copyText(this.dailyGroups.map(d=>this.dayReportText(d)).join('\n\n──────────\n\n'))},
async captureSmartGps(){try{let g=await this.locate();this.smartGps={lat:g.lat,lng:g.lng,accuracy:g.accuracy};if(this.smartParsed)await this.loadSmartSuggestions()}catch{}},async analyzeSmart(){if(!this.smartText.trim())return alert('متن را وارد کن');try{this.smartParsed=await this.api('/smart/parse',{method:'POST',body:JSON.stringify({text:this.smartText})});this.smartCustomerId='';await this.loadSmartSuggestions()}catch(e){alert(e.message)}},async loadSmartSuggestions(){let p=this.smartParsed||{};let qs=new URLSearchParams();if(p.last_name)qs.set('surname',p.last_name);if((p.phones||[])[0])qs.set('phone',p.phones[0]);if(this.smartGps.lat){qs.set('lat',this.smartGps.lat);qs.set('lng',this.smartGps.lng)}this.smartSuggestions=await this.api('/customers/suggest?'+qs.toString())},async registerSmart(){try{let p=this.smartParsed||{};let d=await this.api('/smart/register',{method:'POST',body:JSON.stringify({text:this.smartText,parsed:p,customer_id:this.smartCustomerId||null,latitude:this.smartGps.lat,longitude:this.smartGps.lng,accuracy:this.smartGps.accuracy})});this.smartText='';this.smartParsed=null;this.smartSuggestions=[];this.smartCustomerId='';await this.refreshAll();alert('ثبت هوشمند انجام شد');let c=this.customers.find(x=>String(x.id)===String(d.customer_id));if(c)this.openCustomer(c)}catch(e){alert(e.message)} }
}}
</script></body></html>
