name: AquaGold browser smoke

on:
  push:
    branches: [main, fix/stability-without-ui-regression]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: aquagold_smoke
          POSTGRES_USER: aquagold
          POSTGRES_PASSWORD: aquagold_smoke_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquagold -d aquagold_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AQUAGOLD_DATABASE_URL: postgresql://aquagold:aquagold_smoke_password@127.0.0.1:5432/aquagold_smoke
      AQUAGOLD_ENV: test
      AQUAGOLD_ADMIN_USERNAME: ci-admin
      AQUAGOLD_ADMIN_PASSWORD: ci-bootstrap-password
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app and browser test dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Apply migrations
        run: python scripts/migrate.py
      - name: Start AquaGold
        run: |
          python app.py > /tmp/aquagold-smoke.log 2>&1 &
          echo $! > /tmp/aquagold-smoke.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquagold-smoke.log
          exit 1
      - name: Exercise real browser UI
        run: python tests/browser_smoke.py
      - name: Show app log on failure
        if: failure()
        run: cat /tmp/aquagold-smoke.log || true
