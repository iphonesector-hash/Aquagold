name: AquaGold v6.5 AI entry
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize AquaGold v6.5 AI entry') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire Aqua AI without touching stable auth shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('AquaGold CRM v6.4','AquaGold CRM v6.5')
          s=s.replace('نسخه v6.4','نسخه v6.5')
          s=re.sub(r'\n<link href="/aqua-ai\.css[^"]*" rel="stylesheet">','',s)
          s=s.replace('<link href="/aqua-premium.css?v=20260826-1" rel="stylesheet">','<link href="/aqua-premium.css?v=20260826-1" rel="stylesheet">\n<link href="/aqua-ai.css?v=20260827-v65" rel="stylesheet">',1)
          s=re.sub(r'\n<script src="/aqua-ai\.js[^"]*"></script>','',s)
          marker='<script src="/ui-v4-finalize.js?v=20260827-v64"></script>'
          s=s.replace(marker,'<script src="/aqua-ai.js?v=20260827-v65"></script>\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/aquagold-v65-ai-entry.yml
          git config user.name "aquagold-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/aquagold-v65-ai-entry.yml
          git commit -m "Finalize AquaGold v6.5 AI entry"
          git push
