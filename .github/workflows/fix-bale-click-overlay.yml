name: AquaGold v6.7 click overlay recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bale-click-overlay.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Bale modal fail-safe and bump UI cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bale-ui.js')
          s=p.read_text()
          s=s.replace('<div x-show="baleCompleteJob" class="bale-modal-backdrop"', '<div x-cloak x-show="baleCompleteJob" style="display:none" class="bale-modal-backdrop"')
          s=s.replace('<div x-show="baleCancelJob" class="bale-modal-backdrop"', '<div x-cloak x-show="baleCancelJob" style="display:none" class="bale-modal-backdrop"')
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('AquaGold CRM v6.6','AquaGold CRM v6.7').replace('نسخه v6.6','نسخه v6.7')
          s=s.replace('/bale-ui.js?v=20260827-v66','/bale-ui.js?v=20260827-v67')
          s=s.replace('/bale.css?v=20260827-v66','/bale.css?v=20260827-v67')
          p.write_text(s)
          PY
          rm .github/workflows/fix-bale-click-overlay.yml
          git config user.name aquagold-bot
          git config user.email actions@users.noreply.github.com
          git add bale-ui.js index.html .github/workflows/fix-bale-click-overlay.yml
          git commit -m "Prevent Bale modal overlay from blocking AquaGold controls"
          git push
