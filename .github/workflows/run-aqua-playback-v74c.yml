name: AquaGold Safari playback v7.4c
on:
  push:
    paths:
      - '.github/workflows/run-aqua-playback-v74c.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/repair_aqua_playback_v74c.py
      - run: |
          git config user.name aquagold-bot
          git config user.email actions@users.noreply.github.com
          git add aqua-ai.js
          git commit -m "Use unlocked WebAudio for Aria playback on iPhone"
          git push
