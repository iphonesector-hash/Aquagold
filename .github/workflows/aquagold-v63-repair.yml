name: AquaGold v6.3 one-shot repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize AquaGold v6.3 shell repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize valid auth shell and safe worker bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # The authenticated host is a DIV now; its closing tag must match.
          tail_old='''</nav>\n</div></div>\n</template>\n<script>\nif('serviceWorker' in navigator){addEventListener('load',async()=>{\n  let reloading=false;\n  navigator.serviceWorker.addEventListener('controllerchange',()=>{\n    if(reloading||sessionStorage.getItem('aq_sw_release')==='20260827-3')return;\n    reloading=true;sessionStorage.setItem('aq_sw_release','20260827-3');location.reload();\n  });\n  try{const registration=await navigator.serviceWorker.register('/sw.js?v=20260827-3',{updateViaCache:'none'});await registration.update()}catch{}\n})}\n</script>'''
          tail_new='''</nav>\n</div></div>\n</div>\n<script>\nif('serviceWorker' in navigator){addEventListener('load',async()=>{\n  try{const registration=await navigator.serviceWorker.register('/sw.js?v=20260827-v63',{updateViaCache:'none'});registration.update().catch(()=>{})}catch{}\n})}\n</script>'''
          if tail_old in s:
              s=s.replace(tail_old,tail_new,1)
          else:
              s=s.replace('</nav>\n</div></div>\n</template>\n<script>', '</nav>\n</div></div>\n</div>\n<script>', 1)
              s=re.sub(r"if\('serviceWorker' in navigator\)\{addEventListener\('load',async\(\)=>\{.*?\}\)\}", "if('serviceWorker' in navigator){addEventListener('load',async()=>{\\n  try{const registration=await navigator.serviceWorker.register('/sw.js?v=20260827-v63',{updateViaCache:'none'});registration.update().catch(()=>{})}catch{}\\n})}", s, count=1, flags=re.S)

          # Finalizer must remain last before Alpine.
          s=re.sub(r'\n<script src="/ui-v4-finalize\.js\?v=[^"]+"></script>', '', s)
          alpine='<script defer src="/vendor/alpinejs-3.14.9.min.js"></script>'
          s=s.replace(alpine, '<script src="/ui-v4-finalize.js?v=20260827-v63b"></script>\n'+alpine, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final repair
        run: |
          git config user.name "aquagold-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize AquaGold v6.3 shell repair"
          git push
