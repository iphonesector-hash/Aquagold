name: AquaGold v7.0 navigation repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-navigation-v70.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair navigation and splash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # v7.0 cache/version marker
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'<title>AquaGold CRM v[^<]+</title>','<title>AquaGold CRM v7.0</title>',s)
          s=re.sub(r'نسخه v\d+(?:\.\d+)?','نسخه v7.0',s)
          for asset in ['ui-v4-finalize.js','ui-visual-polish.js','aqua-premium.js','aqua-ai.js','bale-ui.js','ui-v4-enhancements.js']:
              s=re.sub(r'(/'+re.escape(asset)+r')\?v=[^"\']+',r'\1?v=20260827-v70',s)
          s=re.sub(r"/sw\.js\?v=[^'\"]+","/sw.js?v=20260827-v70",s)
          p.write_text(s)

          # One canonical navigation kernel loaded last. Never wait on network before changing page.
          p=Path('ui-v4-finalize.js'); s=p.read_text()
          marker=''' s.login=async function(){'''
          nav=''' s.go=function(p){
  const page=String(p||'dashboard');
  this.page=page;
  try{window.scrollTo({top:0,left:0,behavior:'auto'})}catch{window.scrollTo(0,0)}
  const core=['dashboard','daily','customers','services','expense','finance','insights','reminders','settings'];
  if(core.includes(page))Promise.resolve(this.refreshAll?.()).catch(e=>console.warn('AquaGold refresh',e));
  if(page==='map')setTimeout(()=>{try{this.renderMainMap?.()}catch(e){console.warn('map render',e)}},60);
  if(page==='finance')setTimeout(()=>{try{this.renderCharts?.()}catch(e){console.warn('chart render',e)}},80);
  if(page==='aqua-ai'){try{this.mountAquaAI?.();this.aquaScroll?.()}catch(e){console.warn('aqua-ai nav',e)}}
  if(page==='bale-jobs'){try{this.baleMount?.();Promise.all([this.loadBaleJobs?.(this.baleTab||'new'),this.loadBaleCounts?.()]).catch(e=>console.warn('bale nav',e))}catch(e){console.warn('bale nav',e)}}
  if(['products','product-edit','invoices','invoice-new','invoice-view'].includes(page))Promise.resolve(this.refreshCommerce?.()).catch(e=>console.warn('commerce nav',e));
  return Promise.resolve();
 };
'''
          if 'const page=String(p||\'dashboard\')' not in s:
              if marker not in s: raise SystemExit('finalizer login marker missing')
              s=s.replace(marker,nav+marker)
          p.write_text(s)

          # Splash: SECTOR low and large, immediately above a horizontal progress line.
          p=Path('ui-visual-polish.js'); s=p.read_text()
          s=s.replace(".aq-sector{position:absolute;left:50%;top:55.5%;transform:translateX(-50%);font-family:Vazirmatn,system-ui,sans-serif;font-size:clamp(22px,5.8vw,42px);font-weight:950;letter-spacing:.34em;padding-left:.34em;color:#f8fdff;text-shadow:0 0 12px rgba(76,220,255,.75),0 0 28px rgba(21,123,255,.45);z-index:7;pointer-events:none}",
          ".aq-sector{position:absolute;left:50%;top:75.5%;transform:translateX(-50%);font-family:Vazirmatn,system-ui,sans-serif;font-size:clamp(30px,8vw,54px);font-weight:950;letter-spacing:.34em;padding-left:.34em;color:#f8fdff;text-shadow:0 0 14px rgba(76,220,255,.9),0 0 34px rgba(21,123,255,.55);z-index:7;pointer-events:none;white-space:nowrap}")
          s=re.sub(r"\.aq-loader\{position:absolute;left:50%;top:82\.1%;width:78px;height:78px;transform:translate\(-50%,-50%\);border-radius:50%;border:7px solid rgba\(13,80,148,.58\);border-top-color:#61f2ff;border-right-color:#0aa9ff;animation:aqSpinCenter 1\.02s linear infinite;box-shadow:0 0 24px rgba\(34,215,255,.24\);will-change:transform;pointer-events:none\}",
          ".aq-loader{position:absolute;left:50%;top:83.2%;width:min(72vw,360px);height:6px;transform:translateX(-50%);border-radius:999px;background:rgba(18,79,139,.55);overflow:hidden;box-shadow:0 0 18px rgba(34,215,255,.22);pointer-events:none}.aq-loader:after{content:'';position:absolute;inset:0;width:38%;border-radius:999px;background:linear-gradient(90deg,transparent,#37dfff,#f4d27b,#37dfff,transparent);box-shadow:0 0 16px rgba(55,223,255,.65);animation:aqLineLoad 1.25s ease-in-out infinite}",s)
          s=s.replace("@keyframes aqSpinCenter{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}",
                      "@keyframes aqLineLoad{0%{transform:translateX(-105%)}50%{transform:translateX(85%)}100%{transform:translateX(265%)}}")
          s=s.replace(".aq-loader{top:82.5%;width:68px;height:68px}.aq-sector{top:55%}",".aq-loader{top:84%;width:76vw;max-width:340px}.aq-sector{top:76.5%;font-size:clamp(32px,10vw,48px)}")
          s=s.replace(".aq-ring,.aq-loader{animation-duration:2.5s!important}",".aq-ring{animation-duration:2.5s!important}.aq-loader:after{animation-duration:2.2s!important}")
          p.write_text(s)

          # Regression tests for immediate navigation and requested splash geometry.
          p=Path('tests/test_ui_navigation_v70.py')
          p.write_text('''from pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\ndef src(n): return (ROOT/n).read_text(encoding="utf-8")\ndef test_final_navigation_is_immediate_and_nonblocking():\n    s=src("ui-v4-finalize.js")\n    assert "const page=String(p||'dashboard')" in s\n    assert "this.page=page" in s\n    assert "Promise.resolve(this.refreshAll?.())" in s\n    assert "if(page==='aqua-ai')" in s and "if(page==='bale-jobs')" in s\ndef test_splash_sector_and_linear_loader():\n    s=src("ui-visual-polish.js")\n    assert "top:75.5%" in s\n    assert "font-size:clamp(30px,8vw,54px)" in s\n    assert "aqLineLoad" in s\n    assert "width:min(72vw,360px);height:6px" in s\n    assert "border-radius:50%;border:7px" not in s\ndef test_v70_cache_marker():\n    i=src("index.html")\n    assert "AquaGold CRM v7.0" in i\n    assert "/ui-v4-finalize.js?v=20260827-v70" in i\n    assert "/ui-visual-polish.js?v=20260827-v70" in i\n''',encoding='utf-8')
          PY
      - name: Run tests
        run: |
          pip install -q pytest
          python -m py_compile app_v3.py
          pytest -q tests/test_ui_navigation_v70.py tests/test_ui_runtime_safety.py tests/test_ui_contract.py
      - name: Commit and cleanup
        run: |
          git config user.name aquagold-bot
          git config user.email actions@users.noreply.github.com
          git add index.html ui-v4-finalize.js ui-visual-polish.js tests/test_ui_navigation_v70.py
          git commit -m "Make AquaGold navigation immediate and refine startup loader"
          git push
          git rm .github/workflows/fix-navigation-v70.yml
          git commit -m "Remove one-shot v7.0 navigation workflow"
          git push
