name: AquaGold quality gate

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: aquagold_test
          POSTGRES_USER: aquagold
          POSTGRES_PASSWORD: aquagold_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquagold -d aquagold_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://aquagold:aquagold_test_password@127.0.0.1:5432/aquagold_test
      AQUAGOLD_DATABASE_URL: postgresql://aquagold:aquagold_test_password@127.0.0.1:5432/aquagold_test
      AQUAGOLD_ENV: test
      AQUAGOLD_ADMIN_USERNAME: ci-admin
      AQUAGOLD_ADMIN_PASSWORD: ci-bootstrap-password
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff pip-audit
      - name: Static checks
        run: |
          python -m py_compile *.py scripts/*.py
          ruff check --select=E9,F63,F7,F82 *.py scripts tests
      - name: Apply migrations from zero
        run: python scripts/migrate.py
      - name: Run unit and PostgreSQL/PostGIS integration tests
        run: pytest -q
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
          node --test tests/test_aqua_voice_controller.mjs
          sha256sum -c vendor/SHA256SUMS
      - name: Verify critical production files
        run: |
          test -f neon/migrations/005_security_integrity.sql
          test -f scripts/migrate.py
          grep -q "aquagold_session" app_v3.py
          grep -q "Content-Security-Policy" app_v3.py
          grep -q "customer_phones_phone_unique_idx" neon/migrations/005_security_integrity.sql
