name: AquaGold v6 Farangis integration QA

on:
  push:
    branches: ['farangis-integration-v6']
  pull_request:
    branches: ['main']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Farangis bridge and app
        run: python -m py_compile app.py farangis_bridge.py app_v3.py app_extras.py app_fixes.py app_commerce.py app_routing.py
      - name: Run existing test suite
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Verify bridge routes register
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from app import app
          rules = {rule.rule for rule in app.url_map.iter_rules()}
          required = {'/api/farangis/customer-payment', '/api/farangis/customer-history'}
          missing = required - rules
          assert not missing, f'missing Farangis routes: {sorted(missing)}'
          print('Farangis routes registered')
          PY
