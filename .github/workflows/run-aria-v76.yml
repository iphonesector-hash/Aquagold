name: AquaGold Aria v7.6 repair
on:
  push:
    paths:
      - '.github/workflows/run-aria-v76.yml'
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/repair_aria_voice_v76.py
      - run: python -m py_compile aqua_ai.py app.py
      - run: |
          grep -q "submitAquaText(spoken,'voice')" aqua-ai.js
          grep -q "aquaPlayer" aqua-ai.js
          grep -q "رفیق صمیمی" aqua_ai.py
          grep -q "aqua-ai.js?v=20260827-v76" index.html
      - run: |
          git config user.name aquagold-bot
          git config user.email actions@users.noreply.github.com
          git add aqua-ai.js aqua_ai.py index.html
          git commit -m "Make Aria voice path deterministic and conversational"
          git push
