name: AquaGold Aqua voice v7.4 repair
on:
  push:
    paths:
      - '.github/workflows/run-aqua-voice-v74.yml'
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/repair_aqua_voice_v74.py
      - run: python -m py_compile aqua_ai.py app.py
      - run: |
          grep -q "await this.sendAqua(spoken)" aqua-ai.js
          grep -q "await this.speakAqua(m.content)" aqua-ai.js
          grep -q "groq/compound-mini" aqua_ai.py
          grep -q "v74" index.html
      - run: |
          git config user.name aquagold-bot
          git config user.email actions@users.noreply.github.com
          git add aqua-ai.js aqua_ai.py index.html
          git commit -m "Make Aria voice fully conversational and harden Groq fallback"
          git push
