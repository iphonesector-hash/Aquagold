name: AquaGold Aqua AI v7.2 repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-aqua-voice-v72.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/repair_aqua_voice_v72.py
      - run: python -m py_compile aqua_ai.py app.py
      - run: pip install -q pytest && pytest -q tests/test_aqua_voice_v72.py tests/test_ui_runtime_safety.py tests/test_ui_contract.py
      - run: |
          git config user.name aquagold-bot
          git config user.email actions@users.noreply.github.com
          git add aqua_ai.py aqua-ai.js index.html tests/test_aqua_voice_v72.py
          git commit -m "Fix Aqua AI chat context and stabilize Aria voice"
          git push
