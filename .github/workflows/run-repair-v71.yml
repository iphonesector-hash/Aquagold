name: AquaGold v7.1 repair
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-repair-v71.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/repair_v71.py
      - run: python -m py_compile aqua_ai.py bale_bridge.py app.py
      - run: pip install -q pytest && pytest -q tests/test_bale_smart_v71.py tests/test_ui_runtime_safety.py tests/test_ui_contract.py
      - run: |
          git config user.name aquagold-bot
          git config user.email actions@users.noreply.github.com
          git add bale-ui.js bale_bridge.py aqua-ai.js aqua_ai.py index.html tests/test_bale_smart_v71.py tests/test_ui_runtime_safety.py tests/test_ui_contract.py
          git commit -m "Route Bale completed work through Smart Intake and stabilize AI settings"
          git push
