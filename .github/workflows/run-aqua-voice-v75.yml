name: AquaGold Aqua voice v7.5 repair
on:
  push:
    paths:
      - '.github/workflows/run-aqua-voice-v75.yml'
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/repair_aqua_voice_v75.py
      - run: python -m py_compile aqua_ai.py app.py
      - run: |
          grep -q "aquaTranscribing" aqua-ai.js
          grep -q "aquaAudioKeeper" aqua-ai.js
          grep -q "page!=='aqua-ai'" ui-v4-enhancements.js
      - run: |
          git config user.name aquagold-bot
          git config user.email actions@users.noreply.github.com
          git add aqua-ai.js ui-v4-enhancements.js index.html
          git commit -m "Fix Aria auto-send, persistent audio unlock, and AI floating controls"
          git push
