name: AquaGold v4 predeploy

on:
  push:
    branches:
      - feature/smart-gps-after-analysis
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Python syntax
        run: python -m py_compile app.py app_v3.py app_extras.py app_fixes.py ai_intake.py smart_intake.py
      - name: Smart intake tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_smart_intake.py
      - name: Import application and verify API routes
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from app import app
          rules = {rule.rule for rule in app.url_map.iter_rules()}
          required = {
              '/health', '/api/customers', '/api/jobs', '/api/expenses',
              '/api/settlements', '/api/reports/daily', '/api/reports/analytics',
              '/api/reports/insights', '/api/route/nearest', '/api/audit',
              '/api/export.xlsx', '/api/smart/parse', '/api/smart/register',
          }
          missing = required - rules
          assert not missing, f'missing routes: {sorted(missing)}'
          print(f'Loaded {len(rules)} Flask routes successfully')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend JavaScript syntax
        run: |
          node --check ui-v3.js
          node --check ui-v3-base.js
          node --check ui-v4-enhancements.js
          node --check ui-v4-finalize.js
          node --check sw.js
      - name: Verify AquaGold v4 UI capabilities
        run: |
          grep -q "AquaGold CRM v4" index.html
          grep -q "bottom-nav" index.html
          grep -q "toggleTheme" index.html
          grep -q "روز کاریت، یک نگاه" index.html
          grep -q "گزارش روزانه شمسی" index.html
          grep -q "نقشه زنده مشتری‌ها" index.html
          grep -q "تحلیل مالی و سود و زیان" index.html
          grep -q "تحلیل هوشمند کسب‌وکار" index.html
          grep -q "ثبت GPS همین‌جا" index.html
          grep -q "GPS آماده ثبت است" index.html
          grep -q "smart-result" index.html
          grep -q "toast-stack" index.html
          grep -q "empty-icon" index.html
          grep -q "هزینه‌ها و خریدها" index.html
          grep -q "Excel" index.html
          grep -q "duplicateCandidates" ui-v4-enhancements.js
          grep -q "aq_drafts_v4" ui-v4-enhancements.js
          grep -q "globalResults" ui-v4-enhancements.js
          grep -q "notifications" ui-v4-enhancements.js
          grep -q "backupJson" ui-v4-enhancements.js
          grep -q "backupCsv" ui-v4-enhancements.js
          grep -q "enablePin" ui-v4-enhancements.js
          grep -q "toggleHeatmap" ui-v4-enhancements.js
          grep -q "monthCompare" ui-v4-enhancements.js
          grep -q "profileScore" ui-v4-finalize.js
          grep -q "aquagold-v4" sw.js
          ! grep -q ">انبار<" index.html
          ! grep -q "حالت مراجعه" index.html
